<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привіт! Я вивчаю ШІ</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6, #60a5fa);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            color: #ffffff;
            font-size: clamp(2.5rem, 8vw, 6rem);
            text-align: center;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            padding: 0 20px;
            margin: 0;
        }
        button {
            background: #facc15;
            color: #1e293b;
            border: none;
            border-radius: 16px;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: bold;
            padding: 20px 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
        }
        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        .poster-link {
            display: block;
            width: 100%;
            max-width: min(90vw, 480px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .poster-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
        }
        .poster {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Привіт! Я вивчаю ШІ</h1>
    <button onclick="alert('Ура, це працює!')">Натисни мене</button>
    <a href="https://github.com/finegospodar-png/FirstAI" target="_blank" rel="noopener noreferrer" class="poster-link" title="Перейти на наш сайт">
        <img src="poster.png" alt="Постер — перейти на наш сайт" class="poster">
    </a>
</body>
</html>
